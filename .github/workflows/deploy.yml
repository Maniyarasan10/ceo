name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # GITHUB_ACTIONS is what flips vite.config.js into base: '/ceo/'
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'

      - name: Verify asset URLs use the /ceo/ prefix
        run: |
          grep -q '"/ceo/assets/' dist/index.html \
            || (echo "FAIL: built index.html has no /ceo/ asset prefix" && exit 1)
          grep -q '"base":"/ceo/"' dist/index.html \
            || echo "note: no inlined base found (harmless)"

      - uses: actions/configure-pages@v5
        with:
          # Creates/attaches the Pages site if it does not exist yet. Without this
          # the step fails with "Get Pages site failed - Not Found" on a fresh repo.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4