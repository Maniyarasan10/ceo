name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify asset URLs are relative
        # The site is served from the custom domain root (ceo.problemsolvingmind.com),
        # so asset URLs must stay relative (./assets/...). A hardcoded /ceo/ prefix
        # makes every asset 404 on the domain root and renders a blank page.
        run: |
          grep -q '\./assets/' dist/index.html \
            || (echo "FAIL: built index.html has no relative ./assets/ asset URLs" && exit 1)
          if grep -q '/ceo/assets/' dist/index.html; then
            echo "FAIL: built index.html hardcodes /ceo/assets/, which breaks the custom domain"
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          # Creates/attaches the Pages site if it does not exist yet. Without this
          # the step fails with "Get Pages site failed - Not Found" on a fresh repo.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4